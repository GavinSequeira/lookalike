<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lookalike Feedback — Flask</title>
<style>body{font:16px Arial;background:#f7f6f2;color:#24241f;padding:30px}.card{max-width:620px;margin:auto;background:#fffdf8;padding:28px;border:1px solid #ddd8cb}label{display:grid;gap:6px;margin:14px 0}input,select,textarea{padding:11px;border:1px solid #cfcabe;font:inherit}button{padding:12px 16px;background:#25251f;color:white;border:0;cursor:pointer}.msg{background:#ece9df;padding:12px}</style></head>
<body><main class="card"><p>LOOKALIKE / FLASK FEEDBACK</p><h1>Share your feedback</h1>{% if message %}<p class="msg">{{ message }}</p>{% endif %}
<form method="post" action="/feedback"><label>Name<input name="name" required minlength="2" maxlength="100"></label><label>Email (optional)<input type="email" name="email" maxlength="200"></label><label>Rating<select name="rating" required><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Needs work</option><option value="1">1 — Poor</option></select></label><label>Comments<textarea name="comments" required maxlength="2000" rows="5"></textarea></label><button type="submit">Submit feedback</button></form></main></body></html>
