<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lookalike Feedback — Flask</title>
<style>
body{font:16px 'DM Sans',Arial,sans-serif;background:#f7f6f2;color:#24241f;padding:30px;margin:0}
.card{max-width:620px;margin:auto;background:#fffdf8;padding:28px;border:1px solid #ddd8cb;border-radius:12px}
h1{font-family:Georgia,serif;font-weight:500}
label{display:grid;gap:6px;margin:14px 0}
input,select,textarea{padding:11px;border:1px solid #cfcabe;font:inherit;border-radius:6px}
button{padding:12px 16px;background:#25251f;color:#fff;border:0;cursor:pointer;border-radius:6px}
.msg{padding:12px;border-radius:6px;background:#f3dfd8}.msg.ok{background:#dcebdd}
</style></head>
<body><main class="card"><p>LOOKALIKE / FLASK FEEDBACK</p><h1>Share your feedback</h1>
{% if message %}<p class="msg {{ 'ok' if ok }}">{{ message }}</p>{% endif %}
<form method="post" action="/feedback">
<label>Name<input name="name" required minlength="2" maxlength="100"></label>
<label>Email (optional)<input type="email" name="email" maxlength="200"></label>
<label>Topic<select name="topic"><option value="general">General</option><option value="catalogue">Catalogue</option>
    <option value="design">Design</option><option value="prices">Prices</option>
    <option value="account">Account</option>
</select></label>
<label>Rating<select name="rating" required><option value="5">5 — Excellent</option><option value="4">4 — Good</option>
    <option value="3">3 — Okay</option><option value="2">2 — Needs work</option><option value="1">1 — Poor</option>
</select></label>
<label>Comments<textarea name="comments" required minlength="3" maxlength="2000" rows="5"></textarea></label>
<button type="submit">Submit feedback</button></form></main></body></html>
